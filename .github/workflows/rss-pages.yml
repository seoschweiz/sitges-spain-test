name: Update Sitges RSS News
on:
  push:
    paths:
      - '.github/workflows/rss-pages.yml'
      - 'scripts/update_rss.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/update_rss.py
      - run: |
          git config user.name "Sitges News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitges-news/index.html
          git diff --cached --quiet || git commit -m "Update Sitges RSS headlines"
          git push
